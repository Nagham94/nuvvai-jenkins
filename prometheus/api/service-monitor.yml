apiVersion: monitoring.coreos.com/v1 
kind: ServiceMonitor
metadata:
  name: api-service-monitor 
  labels:
    release: prometheus 
    app: prometheus
spec:
  jobLabel: app
  endpoints:
    - interval: 30s 
      port: http 
      path: metrics/
  selector:
    matchLabels:
       app: nuvvai-backend-service 